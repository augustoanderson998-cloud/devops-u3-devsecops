apiVersion: v1
kind: Pod
metadata:
  name: pod-leitor
  namespace: default
  labels:
    app: leitor-app
spec:
  serviceAccountName: leitor-app
  containers:
    - name: app-container
      image: python:3.9-slim
      command: ["sh", "-c", "python -m http.server 8080"]
      ports:
        - containerPort: 8080
