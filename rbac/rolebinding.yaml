apiVersion: v1
kind: ServiceAccount
metadata:
  name: leitor-app
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leitor-app-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: leitor-app
    namespace: default
roleRef:
  kind: Role
  name: leitor-pods-role
  apiGroup: rbac.authorization.k8s.io
